<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #fcf9f7;
            color: #3d2c2a;
            line-height: 1.6;
            padding: 24px 20px;
        }

        header, nav, main, footer {
            max-width: 960px;
            margin: 0 auto 24px auto;
            background-color: #ffffff;
            padding: 24px 32px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(180, 140, 130, 0.08);
        }

        header {
            text-align: center;
            border-bottom: 5px solid #e8d5cd;
        }

        header h1 {
            font-size: 2.5rem;
            color: #3d2c2a;
            font-weight: 600;
        }

        header p {
            font-size: 1rem; /* Fixed: was incomplete "font-size: 1" */
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome</h1>
        <p>This is a fixed version of your code.</p>
    </header>

    <nav>
        <p>Navigation goes here</p>
    </nav>

    <main>
        <p>Main content goes here</p>
    </main>

    <footer>
        <p>Footer content goes here</p>
    </footer>
</body>
</html>
